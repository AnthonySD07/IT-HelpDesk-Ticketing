{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto" style="max-width:640px">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">New ticket</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include '_form_fields.html' %}
      <button class="btn btn-primary">Submit ticket</button>
      <a class="btn btn-outline-secondary" href="{% url 'ticket_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
