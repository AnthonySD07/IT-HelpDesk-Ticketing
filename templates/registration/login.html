{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block auth %}
<div class="auth">
  {% include '_auth_brand.html' %}
  <div class="auth-form-wrap">
    <div class="auth-form">
      <h1 class="h3 mb-1">Welcome back</h1>
      <p class="text-secondary mb-4">Log in to manage your tickets.</p>
      <form method="post">
        {% csrf_token %}
        {% include '_form_fields.html' %}
        <button class="btn btn-primary w-100 py-2">Log in</button>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
