{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block auth %}
<div class="auth">
  {% include '_auth_brand.html' %}
  <div class="auth-form-wrap">
    <div class="auth-form">
      <h1 class="h3 mb-1">Create your account</h1>
      <p class="text-secondary mb-4">It takes less than a minute.</p>
      <form method="post">
        {% csrf_token %}
        {% include '_form_fields.html' %}
        <button class="btn btn-primary w-100 py-2">Register</button>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
